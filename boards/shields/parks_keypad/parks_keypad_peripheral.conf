# P0.09/P0.10 핀을 NFC 대신 일반 GPIO로 사용하도록 설정 (필수)
CONFIG_NFCT_PINS_AS_GPIOS=y

# Split 무선 송신 (Peripheral)
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# 절전(Deep Sleep) 비활성화
CONFIG_ZMK_SLEEP=n

# EC11 로터리 엔코더 활성화
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# 블루투스 송출 출력 증폭 (+8dBm)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
